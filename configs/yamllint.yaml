# yamllint rules shared by every repo. Relaxed base, long comment lines allowed up to 120.
extends: relaxed
rules:
  line-length:
    max: 120
  document-start: disable
  octal-values:              # `mode: 0644` is the number 420 in YAML 1.1, `0o644` the same in 1.2: quote it
    forbid-implicit-octal: true
    forbid-explicit-octal: true
    level: error             # relaxed downgrades rules to warnings, which do not fail the commit
